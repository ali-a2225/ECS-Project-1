name: Terraform Destroy

# Allow manual trigger
on:
  workflow_dispatch:
    inputs:
      terraform_destroy:
        description: 'If you want to destroy the terraform environment, please type "DESTROY TF". Please not this will destroy all of the AWS resources'
        required: true
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: ${{ github.event.inputs.terraform_destroy == 'DESTROY TF' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume:  ${{  secrets.AWS_OIDC_ROLE }}
        aws-region: eu-west-2

    - name: Verify AWS CLI is available
      run: aws --version

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init
      working-directory: terraform

    - name: Terraform Destroy
      run: terraform destroy -auto-approve
      working-directory: terraform

