name: Terraform Init, Plan and Apply
on:
  push:
    # branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf*.yaml'

permissions:
  id-token: write
  contents: read
  pull-requests: write


jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume:  ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: eu-west-2
  
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
       terraform_version: 1.15.5
  
    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v6
      with:
        tflint_version: v0.62.1
        cache: true

    # if formatting fails force developer to fix it before merging
    - name: Check Terraform fmt
      uses: dflook/terraform-fmt-check@v2
      with:
        path: terraform

    - name: Terraform Init
      run: terraform init -input=false

    - name: terraform validate
      uses: dflook/terraform-validate@v2
      id: validate
      with:
          path: terraform

    # download provider specific linting rules
    - name: TFLint Init
      run: tflint --init
      working-directory: terraform

  # run linting rules and fail if any issues are found
    - name: Run TFLint
      run: tflint --format compact
      working-directory: terraform

    


    # - name: Create Pull Request
    #   uses: peter-evans/create-pull-request@v5
    #   with:
    #       commit-message: terraform fmt
    #       title: Reformat terraform files
    #       body: Update Terraform files to canonical format using `terraform fmt`
    #       branch: automated-terraform-fmt
    #   continue-on-error: true


    # - name: Terraform security scan (tfsec)
    #   uses: triat/terraform-security-scan@v3.0.0
    #   with:
    #     path: terraform          
    #     scanners: tfsec    
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #   continue-on-error: true


    - name: terraform plan
      uses: dflook/terraform-plan@v2
      with:
          path: terraform
    

  apply:
    runs-on: ubuntu-latest
    needs: checks                        # only runs if checks job passes
    if: github.ref == 'refs/heads/main'  # only runs on main branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: eu-west-2

      - name: Terraform Apply
        uses: dflook/terraform-apply@v2.2.3
        env:
          TF_VAR_GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          TF_VAR_GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
        with:
          path: terraform
          auto_approve: true